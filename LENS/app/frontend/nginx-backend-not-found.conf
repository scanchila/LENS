# Proxy /api/* to the backend service. In compose-network this is the
# `backend` DNS name resolved by Docker. In Traefik-fronted production
# the path is also handled by Traefik, but the in-frontend proxy works
# as a fallback for direct port access (e.g. http://localhost:5173).
location /api {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # SSE-friendly: never buffer, never cache, very long read timeout.
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 24h;
    proxy_send_timeout 24h;
}

location /docs {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location /redoc {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
